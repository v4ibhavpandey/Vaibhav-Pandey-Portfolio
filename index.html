    <script>
      (function() {
        try {
          const saved = localStorage.getItem('vp_portfolio_theme');
          if (saved === 'light') {
            document.documentElement.classList.remove('dark');
          } else {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {}
      })();
    </script>
